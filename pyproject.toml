[project]
name = "leetrace"
version = "0.1.0"
description = "Multiplayer LeetCode racing webapp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.12.5",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
build = [
    "datasets>=3.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=2.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.1",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
typecheck = "mypy scripts/corpus.py scripts/corpus_dataclasses.py --follow-imports=silent"
lint = "ruff check server scripts tests corpus --exclude corpus/scratch"
test = "pytest"
corpus = "python -m scripts.corpus"
ci = "task typecheck && task lint && task test"

[tool.ruff]
# Reference solutions execute with the imports and node helpers in each preamble.
builtins = [
    "List", "Optional", "Dict", "Tuple", "Set", "Deque", "DefaultDict",
    "Iterable", "Iterator", "Sequence", "Callable", "TreeNode", "ListNode",
    "Counter", "deque", "defaultdict", "cache", "lru_cache", "reduce",
    "heappush", "heappop", "heapify", "heapreplace", "heappushpop",
    "bisect_left", "bisect_right", "insort", "inf", "gcd", "lcm", "isqrt",
    "sqrt", "ceil", "floor", "factorial", "comb", "product", "permutations",
    "combinations", "accumulate", "pairwise", "math", "collections", "functools",
    "itertools", "bisect", "heapq", "string", "re", "datetime",
]
